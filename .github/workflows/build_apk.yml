name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libsqlite3-dev \
            libltdl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip wheel setuptools
          pip install --upgrade buildozer "cython<3" virtualenv

      - name: Build APK
        working-directory: Android_Kivy
        env:
          # 使用 GitHub Runner 预装的 Android SDK
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "21"
        run: |
          # 清理之前的构建
          rm -rf .buildozer
          # 开始构建
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koreaderremote-apk
          path: Android_Kivy/bin/*.apk
          if-no-files-found: error

      - name: Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Android_Kivy/build.log
